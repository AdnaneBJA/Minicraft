# The hosted game: minicraft-server, the stats service and its database, behind Caddy, which adds TLS (wss://,
# https://) with a free certificate.
#   cd deploy && docker compose up -d --build
# .env (next to this file) holds DOMAIN, POSTGRES_PASSWORD and STATS_TOKEN. See deploy/README.md.
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    expose:
      - "7777"
    environment:
      # What players do goes to the stats service. Remove these two lines to run the game without stats.
      STATS_URL: http://stats:8080/events
      STATS_TOKEN: ${STATS_TOKEN:?set STATS_TOKEN in .env}

  stats:
    build:
      context: ..
      dockerfile: stats/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://stats:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/stats?sslmode=disable
      STATS_TOKEN: ${STATS_TOKEN:?set STATS_TOKEN in .env}
    mem_limit: 64m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stats
      POSTGRES_DB: stats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stats", "-d", "stats"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
      - stats
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the server's domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
  pgdata:
