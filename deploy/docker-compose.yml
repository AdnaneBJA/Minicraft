# The hosted game: minicraft-server, the stats service and its database, and the monitoring (a probe, Prometheus and
# Grafana), behind Caddy, which adds TLS (wss://, https://) with a free certificate.
#   cd deploy && docker compose up -d --build
# .env (next to this file) holds DOMAIN, POSTGRES_PASSWORD, STATS_TOKEN and GRAFANA_ADMIN_PASSWORD. See
# deploy/README.md.
services:
  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    expose:
      - "7777"
    environment:
      # What players do goes to the stats service. Remove these two lines to run the game without stats.
      STATS_URL: http://stats:8080/events
      STATS_TOKEN: ${STATS_TOKEN:?set STATS_TOKEN in .env}

  stats:
    build:
      context: ..
      dockerfile: stats/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    environment:
      DATABASE_URL: postgres://stats:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/stats?sslmode=disable
      STATS_TOKEN: ${STATS_TOKEN:?set STATS_TOKEN in .env}
    mem_limit: 64m

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: stats
      POSTGRES_DB: stats
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "stats", "-d", "stats"]
      interval: 5s
      timeout: 5s
      retries: 20
    mem_limit: 192m

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - server
      - stats
      - grafana
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN to the server's domain name}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  probe:
    # Plays the game from the outside every 30 s, as a hidden observer, through Caddy and TLS like a player.
    build:
      context: ..
      dockerfile: loadtest/Dockerfile
    restart: unless-stopped
    depends_on:
      - caddy
    command: ["--url", "${PROBE_URL:-wss://${DOMAIN}}"]
    expose:
      - "9100"
    mem_limit: 32m

  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus_data:/prometheus
    expose:
      - "9090"
    mem_limit: 128m

  grafana:
    # Public and read-only (anonymous viewers) at https://$DOMAIN/grafana; sign in as admin to edit.
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_SECURITY_COOKIE_SECURE: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/player-experience.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    expose:
      - "3000"
    mem_limit: 160m

volumes:
  caddy_data:
  caddy_config:
  pgdata:
  prometheus_data:
  grafana_data:
