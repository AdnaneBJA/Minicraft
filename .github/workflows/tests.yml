name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure (server and tests, no game)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMINICRAFT_BUILD_CLIENT=OFF
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  stats:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    defaults:
      run:
        working-directory: stats
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: stats/go.mod
          cache-dependency-path: stats/go.sum
      - name: Vet
        run: go vet ./...
      - name: Test (against PostgreSQL 17)
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
        run: go test -count=1 ./...

  images:
    # The production images build (the server's also runs the C++ tests on Linux inside the build).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the game server image
        run: docker build -f server/Dockerfile -t minicraft-server .
      - name: Build the stats service image
        run: docker build -f stats/Dockerfile -t minicraft-stats .
